# Periodic park-media orphan sweep (#57).
# Preferred when the app is not on Vercel Cron: call the deployed route with CRON_SECRET.
# Vercel deployments can use vercel.json crons instead (same route + CRON_SECRET).
name: Park-media orphan cron

on:
  schedule:
    # Daily 12:15 UTC — same cadence as vercel.json.
    - cron: "15 12 * * *"
  workflow_dispatch:

concurrency:
  group: park-media-orphan-cron
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep orphan park-media
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require secrets
        env:
          CAMPY_APP_URL: ${{ secrets.CAMPY_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CAMPY_APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Skipping: set GitHub Actions secrets CAMPY_APP_URL and CRON_SECRET to enable."
            echo "See supabase/probes/park-media-storage.md (Periodic cron)."
            exit 0
          fi
          echo "SECRETS_OK=1" >> "$GITHUB_ENV"

      - name: Invoke cron route
        if: env.SECRETS_OK == '1'
        env:
          CAMPY_APP_URL: ${{ secrets.CAMPY_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          base="${CAMPY_APP_URL%/}"
          url="${base}/api/cron/park-media-orphan-sweep"
          echo "POST ${url}"
          body="$(curl -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            --max-time 90 \
            "${url}")"
          status="$(printf '%s' "${body}" | tail -n 1)"
          payload="$(printf '%s' "${body}" | sed '$d')"
          echo "HTTP ${status}"
          echo "${payload}"
          case "${status}" in
            200) ;;
            *)
              echo "Cron sweep failed with HTTP ${status}"
              exit 1
              ;;
          esac
