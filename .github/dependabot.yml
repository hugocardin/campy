version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep @types/node aligned with engines.node / .nvmrc (currently 22.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
